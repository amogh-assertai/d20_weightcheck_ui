[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Quieter output by default; -v when you want the full list.
addopts = --tb=short --strict-markers

# eventlet prints a deprecation warning on import. It's still the supported
# async worker for Flask-SocketIO, so this is noise rather than a signal.
# Note: EventletDeprecationWarning subclasses Warning (not DeprecationWarning),
# so it has to be named explicitly - a generic DeprecationWarning filter misses it.
filterwarnings =
    ignore::eventlet.EventletDeprecationWarning
